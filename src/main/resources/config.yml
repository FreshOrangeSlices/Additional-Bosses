# ===============================
# Additional-Bosses
# ===============================

# ===============================
# Boss Spawn Settings
# ===============================
spawn:
  one_in: 50

mobs:
  whitelist:
    - ZOMBIE
    - SKELETON
    - SPIDER
    - HUSK
    - STRAY

# ===============================
# Messaging
# ===============================
messages:
  enabled: true
  radius: 40
  mode: "ACTIONBAR" # CHAT | ACTIONBAR | TITLE

  spawn:
    enabled: true
    format: "&6A {rank_color}{title}{mob} &6wanders nearby..."

  death:
    enabled: true
    format: "&aDefeated: {rank_color}{title}{mob} &e(+{rank_xp}x XP)"

  despawn:
    enabled: true
    format: "&7Faded: {rank_color}{title}{mob}"

# ===============================
# Despawn Rules
# ===============================
despawn:
  enabled: true
  after_seconds: 120
  only_if_no_players_within: 48
  require_no_target: true

# ===============================
# Base Stat Defaults (fallback)
# ===============================
stats:
  health_multiplier: 4.0
  damage_multiplier: 1.5
  speed_multiplier: 1.0

# ===============================
# Boss Nameplate (above mob)
# ===============================
boss:
  name:
    enabled: true
    color: "&c"
    text: ""  # blank = use mob name automatically

# ===============================
# Bossbar (Wither/Dragon style)
# ===============================
bossbar:
  enabled: true

  # Only show bar while boss is in combat
  combat_only: true
  combat_window_ms: 12000

  # Player visibility range
  radius: 40

  # How often HP + title update (ticks)
  update_ticks: 10

  # NEW: how often nearby players are re-evaluated (ticks)
  # Higher = less CPU, slower join/leave reaction
  viewer_update_ticks: 20

  # defaults (rank can override)
  color: "PURPLE"
  style: "SOLID"

  title_format: "&6{rank_color}{title}{mob} &7[{affixes}]"
  max_affixes_shown: 3

# ===============================
# Rewards
# ===============================
rewards:
  xp_multiplier: 1.0

# ===============================
# Ranks (weighted)
# ===============================
# ===============================
# Ranks (weighted)
# ===============================
ranks:
  common:
    weight: 60
    label: "Common"
    color: "&7"
    xp_multiplier: 25.0
    max_affixes: 1
    stats:
      health_multiplier: 3.0
      damage_multiplier: 1.2
      speed_multiplier: 1.0
    bossbar:
      color: "WHITE"
      style: "SOLID"

  green:
    weight: 25
    label: "Uncommon"
    color: "&a"
    xp_multiplier: 50.0
    max_affixes: 1
    stats:
      health_multiplier: 3.5
      damage_multiplier: 1.3
      speed_multiplier: 1.03
    bossbar:
      color: "GREEN"
      style: "SEGMENTED_6"

  red:
    weight: 10
    label: "Epic"
    color: "&c"
    xp_multiplier: 100.0
    max_affixes: 2
    stats:
      health_multiplier: 4.75
      damage_multiplier: 1.6
      speed_multiplier: 1.06
    bossbar:
      color: "RED"
      style: "SEGMENTED_10"

  rare:
    weight: 4
    label: "Rare"
    color: "&d"
    xp_multiplier: 125.0
    max_affixes: 2
    stats:
      health_multiplier: 5.5
      damage_multiplier: 1.75
      speed_multiplier: 1.08
    bossbar:
      color: "PURPLE"
      style: "SEGMENTED_10"

  mythic:
    weight: 1
    label: "Mythic"
    color: "&6"
    xp_multiplier: 150.0
    max_affixes: 3
    stats:
      health_multiplier: 6.5
      damage_multiplier: 1.9
      speed_multiplier: 1.10
    bossbar:
      color: "YELLOW"
      style: "SEGMENTED_12"


# ===============================
# Affixes
# ===============================
affixes:
  enabled: true
  max_per_boss: 2

  pool:
    lifesteal:
      weight: 4
      name: "Lifesteal"

    swift:
      weight: 6
      name: "Swift"

    molten:
      weight: 3
      name: "Molten"

    thorned:
      weight: 4
      name: "Thorned"

affix_titles:
  lifesteal: "Vampiric"
  swift: "Fleet"
  molten: "Molten"
  thorned: "Barbed"

# ===============================
# Raffle System
# ===============================
raffle:
  debug: false
  max_slots_per_armor: 3

  require_token_mainhand: true
  require_armor_offhand: true
  cooldown_ms: 250

  message:
    success: "&dSomething shifts within the armor..."
    fail_generic: "&c{reason}"

  sound:
    success:
      enabled: true
      key: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 0.8
      pitch: 1.2
    fail:
      enabled: true
      key: "ENTITY_VILLAGER_NO"
      volume: 0.7
      pitch: 0.9
      
  effects:
    - VITALITY
    - IRON_WILL
    - BLOOD_MENDING
    - SKYBOUND
    - EMBER_WARD
    - SIGHTBEYOND
    - TIDEBOUND
    - OCEAN_GRACE
    - FORTUNE
    - VILLAGER_FAVOR
    - GECKO_GRIP
    - DREAD
    - TERROR
    - ECHOES
    - DISARRAY
    - MATADOR
    - MOTHER_HEN
    - REDUCTION
